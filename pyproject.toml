[project]
name = "mcp-browser-agent"
version = "0.2.0"
description = "Tool-calling LLM agents over MCP: browser automation, web search and a self-built RAG MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "mcp>=1.30,<2",
    "mcp-use>=1.7.1",
    "openai-agents>=0.25",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
